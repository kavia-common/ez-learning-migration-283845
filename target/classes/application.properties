# Spring Boot 3 core properties and defaults

# Ensure Flyway picks up migrations from classpath
spring.flyway.locations=classpath:db/migration

# Use Flyway-managed schema; do not auto-create/alter via Hibernate
spring.jpa.hibernate.ddl-auto=none

# Default datasource driver (overridden by profile-specific configs, e.g., dev H2)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Active profile (default to dev). Override with APP_PROFILE env var if needed.
spring.profiles.active=${APP_PROFILE:dev}

# Server configuration (env-overridable with sane defaults for previews/runs)
# Use SERVER_PORT and SERVER_ADDRESS environment variables to override as needed.
server.port=${PORT:${SERVER_PORT:3001}}
server.address=${SERVER_ADDRESS:0.0.0.0}

# Ignore CLI property injection (preview sometimes passes --server.* to Maven and fails).
spring.main.add-command-line-properties=false

# H2 console is enabled only for the dev profile; see application-dev.properties
